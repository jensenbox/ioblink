[package]
name = "ioblink"
version = "0.1.2"
edition = "2021"
description = "Blink a keyboard LED in response to block-device (NVMe/SATA) read and write activity"
license = "MIT"
repository = "https://github.com/jensenbox/ioblink"
readme = "README.md"
keywords = ["led", "disk", "nvme", "systemd", "sysfs"]
categories = ["command-line-utilities", "os::linux-apis"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "1"
log = "0.4"
env_logger = "0.11"
signal-hook = "0.3"
libc = "0.2"

[profile.release]
lto = true
strip = true
